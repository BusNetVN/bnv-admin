name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull main and deploy admin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git -C F:\bnv-admin checkout main
          if (git -C F:\bnv-admin remote get-url origin 2>$null) {
            git -C F:\bnv-admin fetch origin
            git -C F:\bnv-admin pull --ff-only origin main
          }
          Set-Location F:\
          docker compose up --build -d admin
